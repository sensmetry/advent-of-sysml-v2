#:schema https://docs.sensmetry.com/schemas/latest/syside.schema.json
[format]
line-width = 100
tab-width = 4
tabs = false

[format.keywords.defined-by]
fallback = "token"
preserve = false

[format.keywords.redefines]
fallback = "token"
preserve = false

[format.keywords.specializes]
fallback = "keyword"
preserve = false

[format.keywords.subsets]
fallback = "keyword"
preserve = false

[format.keywords.references]
fallback = "keyword"
preserve = false

[format.keywords.crosses]
fallback = "keyword"
preserve = false

[format.synth]
literal-real = "prec"

[lsp.inlay-hints.implicit-specializations]
standard-library = true

[lsp.hover]
force-root-to-workspace = false
path-resolution = "relative"

# [lint.global-namespace-distinguishability]
# type = "information"

# Viz settings

[viz.layout.render_style]
general          = "nested"
interconnection  = "nested"
action_flow      = "nested"
state_transition = "nested"
sequence         = "nested"

[viz.expose]
# subtree | promoted | flat
mode = "subtree"

[viz.compartments]
# max_entries              = 1    # -1 unlimited, 0 hides feature compartments, N shows the first N entries; doc and metadata are never capped
show_inherited_rows      = true  # false hides inherited (^) compartment rows
show_annotation_rows     = true  # false hides doc and metadata compartment rows

[viz.labels]
show_fork_join_labels    = false
show_decide_merge_labels = false

[viz.filters.general]
show_node_heritage_edges = true
show_port_heritage_edges = false
show_inherited_nodes     = true
show_attributes_as     = "compartments"  # "nodes" | "compartments" | "hidden" (unset: compartments in nested, nodes in tree)

[viz.filters.interconnection]
show_node_heritage_edges = true
show_port_heritage_edges = false
show_inherited_nodes     = true
# show_attributes_as     = "nodes" | "compartments" | "hidden" (unset: compartments in nested, nodes in tree)

[viz.filters.action_flow]
show_node_heritage_edges = true
show_port_heritage_edges = false
show_inherited_nodes     = true
# show_attributes_as     = "nodes" | "compartments" | "hidden" (unset: compartments in nested, nodes in tree)

[viz.filters.state_transition]
show_node_heritage_edges = true
show_port_heritage_edges = false
show_inherited_nodes     = true
# show_attributes_as     = "nodes" | "compartments" | "hidden" (unset: compartments in nested, nodes in tree)

[viz.filters.sequence]
show_node_heritage_edges = true
show_port_heritage_edges = false
show_inherited_nodes     = true
# show_attributes_as     = "nodes" | "compartments" | "hidden" (unset: compartments in nested, nodes in tree)

[viz.render]
# zoom_level = 3.0

[viz.style]
# light | dark | light_mono | dark_mono
theme = "light"

[viz.style.group.uniform]
members          = [
  "PartUsage", "PartDefinition",
  "ActionUsage", "ActionDefinition",
  "ItemUsage", "ItemDefinition",
  "PortUsage", "PortDefinition",
  "RequirementUsage", "RequirementDefinition",
  "AttributeUsage", "AttributeDefinition",
  "StateUsage", "StateDefinition",
  "ConstraintUsage", "ConstraintDefinition",
  "UseCaseUsage", "UseCaseDefinition",
  "InterfaceUsage", "InterfaceDefinition",
  "EnumerationUsage", "EnumerationDefinition",
  "ReferenceUsage",
]
stroke           = "#2c2c2eff"

# [viz.style.group.plain_usages]
# members          = ["Usage"]
# fill_header      = "#FD7D5D"
# fill_body        = "#FFEEEE"
# text_keyword     = "#5C2E22"

